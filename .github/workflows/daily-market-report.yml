name: Daily market report

on:
  workflow_dispatch:
    inputs:
      send_discord:
        description: "최종 검토가 끝난 경우에만 Discord로 전송"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run validation tests
        run: python -m unittest -v test_market_report.py

      - name: Generate report
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: bash run_daily.sh

      - name: Upload report files
        uses: actions/upload-artifact@v4
        with:
          name: market-report-${{ github.run_id }}
          path: reports/
          retention-days: 14

      - name: Send report to Discord
        if: ${{ inputs.send_discord == true }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [[ -z "$DISCORD_WEBHOOK_URL" ]]; then
            echo "DISCORD_WEBHOOK_URL is not configured; skipping Discord delivery."
            exit 0
          fi
          zip -qr market-report.zip reports/
          curl --fail-with-body --retry 2 \
            -F 'payload_json={"content":"오늘의 미국장 반도체·매크로 보고서입니다."}' \
            -F 'file1=@market-report.zip' \
            "$DISCORD_WEBHOOK_URL"
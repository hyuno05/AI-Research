name: Daily market report

on:
  workflow_dispatch:
  schedule:
    # 00:00 UTC = 09:00 KST, 07:00 UTC = 16:00 KST. Schedules use UTC.
    - cron: "0 0 * * 1-5"
    # One-time test: 2026-09-19 02:45 UTC = 2026-09-19 11:45 KST.
    - cron: "45 2 19 9 *"
    # One-time test: 2026-09-19 03:00 UTC = 2026-09-19 12:00 KST.
    - cron: "0 3 19 9 *"
    - cron: "0 7 * * 1-5"
    # Temporary one-time test: 2026-09-18 23:00 UTC = 2026-09-19 08:00 KST.
    - cron: "0 23 18 9 *"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run validation tests
        run: python -m unittest -v test_market_report.py

      - name: Generate report
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: bash run_daily.sh

      - name: Upload report files
        uses: actions/upload-artifact@v4
        with:
          name: market-report-${{ github.run_id }}
          path: reports/
          retention-days: 14

      - name: Send report to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [[ -z "$DISCORD_WEBHOOK_URL" ]]; then
            echo "DISCORD_WEBHOOK_URL is not configured; skipping Discord delivery."
            exit 0
          fi
          zip -qr market-report.zip reports/
          curl --fail-with-body --retry 2 \
            -F 'payload_json={"content":"오늘의 미국장 반도체·매크로 보고서입니다."}' \
            -F 'file1=@market-report.zip' \
            "$DISCORD_WEBHOOK_URL"